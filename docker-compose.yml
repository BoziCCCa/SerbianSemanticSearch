# Qdrant vector database for Serbian semantic search.
# Only Qdrant runs in Docker. The Python code (embedding model, scripts)
# runs on the host so it can use the host GPU directly.
services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: serbian-semantic-qdrant
    restart: unless-stopped
    ports:
      # 6333 = REST API + web dashboard (http://localhost:6333/dashboard)
      - "6333:6333"
      # 6334 = gRPC (faster for bulk upserts from the Python client)
      - "6334:6334"
    volumes:
      # Named volume so collections survive `docker compose down`.
      # Use `docker compose down -v` to wipe all stored data.
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The Qdrant image is debian-slim and ships bash but neither curl nor wget,
      # so we use bash's /dev/tcp pseudo-device to confirm the REST port is open.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
    name: serbian-semantic-qdrant-storage
